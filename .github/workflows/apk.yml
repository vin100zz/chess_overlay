name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et compilation
        run: ./gradlew --no-daemon :core:test :app:assembleDebug

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk echecs-overlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: echecs-overlay-apk
          path: echecs-overlay.apk

      # Publication sur une page « Release » : l'APK se télécharge directement depuis le téléphone.
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: echecs-apk
          name: Échecs Overlay (dernière version)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            APK de l'appli Échecs Overlay, construit automatiquement depuis la branche `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Sur le téléphone : téléchargez `echecs-overlay.apk`, ouvrez-le et autorisez l'installation.
          files: echecs-overlay.apk
